[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-subtitle-translator"
version = "0.1.1"
description = "Live Windows system audio translation with a movable subtitle overlay"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]

[project.gui-scripts]
pc-subtitle-translator = "pc_subtitle_translator.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pc_subtitle_translator*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
